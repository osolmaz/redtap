name: quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --check .
      - run: pnpm exec eslint .
      - run: pnpm exec tsc -p tsconfig.json --noEmit
      - run: pnpm exec tsc -p space/tsconfig.json --noEmit
      - run: pnpm exec vitest run
      - run: pnpm exec vitest run --coverage
      - run: pnpm run build
      - run: pnpm run mutate
      - run: pnpm exec slophammer-ts dry .
      - run: pnpm exec slophammer-ts check . --execute
